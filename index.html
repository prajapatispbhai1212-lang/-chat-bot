
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 900px;
    height: 95vh;
    background: #1e293b;
    display: flex;
    flex-direction: column;
    border-radius: 15px;
    overflow: hidden;
}

header {
    background: #111827;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    color: #38bdf8;
}

header button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background: #ef4444;
    color: white;
    cursor: pointer;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    max-width: 80%;
    padding: 14px;
    border-radius: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #2563eb;
    align-self: flex-end;
}

.bot {
    background: #334155;
    align-self: flex-start;
}

#typing {
    color: #38bdf8;
    padding: 0 20px 10px;
}

.input-area {
    display: flex;
    padding: 15px;
    gap: 10px;
    background: #111827;
}

input {
    flex: 1;
    padding: 15px;
    border: none;
    outline: none;
    border-radius: 10px;
    font-size: 16px;
}

#send {
    padding: 15px 22px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    font-weight: bold;
    cursor: pointer;
}

#send:disabled {
    opacity: .5;
}

@media(max-width:600px) {
    .container {
        height: 100vh;
        border-radius: 0;
    }
    .message {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h2>🤖 My AI Assistant</h2>
    <button onclick="clearChat()">New Chat</button>
</header>

<div id="chat">

    <div class="message bot">
        Hello! 👋

        Welcome to My AI Assistant.

        Ask me anything. I'm here to help!
    </div>

</div>

<div id="typing"></div>

<div class="input-area">

    <input
        id="input"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
    >

    <button id="send" onclick="sendMessage()">
        Send ➤
    </button>

</div>

</div>

<script>

const API_URL = "/api/chat";

let messages = [];

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const typing = document.getElementById("typing");
const send = document.getElementById("send");

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

    const text = input.value.trim();

    if (!text || send.disabled) return;

    addMessage(text, "user");

    input.value = "";

    messages.push({
        role: "user",
        content: text
    });

    typing.textContent = "AI is thinking...";

    send.disabled = true;

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                messages: messages
            })

        });

        if (!response.ok) {
            throw new Error("Server error");
        }

        const data = await response.json();

        if (typeof data.reply !== "string") {
            throw new Error("Invalid response");
        }

        addMessage(data.reply, "bot");

        messages.push({
            role: "assistant",
            content: data.reply
        });

    } catch (error) {

        messages.pop();

        addMessage(
            "⚠️ Unable to connect to AI. Please check your server connection.",
            "bot"
        );

    } finally {

        typing.textContent = "";

        send.disabled = false;

        input.focus();

    }
}

function clearChat() {

    messages = [];

    chat.innerHTML = "";

    addMessage(
        "Hello! 👋 Welcome back. Ask me anything!",
        "bot"
    );

}

input.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
