
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 900px;
    height: 95vh;
    background: #1e293b;
    display: flex;
    flex-direction: column;
    border-radius: 15px;
    overflow: hidden;
}

header {
    background: #111827;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    color: #38bdf8;
}

header button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background: #ef4444;
    color: white;
    cursor: pointer;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    max-width: 80%;
    padding: 14px;
    border-radius: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #2563eb;
    align-self: flex-end;
}

.bot {
    background: #334155;
    align-self: flex-start;
}

#typing {
    color: #38bdf8;
    padding: 0 20px 10px;
}

.input-area {
    display: flex;
    padding: 15px;
    gap: 10px;
    background: #111827;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: none;
    outline: none;
    border-radius: 10px;
    font-size: 16px;
}

#send {
    padding: 15px 22px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    font-weight: bold;
    cursor: pointer;
}

#send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

@media(max-width:600px) {
    .container {
        height: 100vh;
        border-radius: 0;
    }

    .message {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h2>🤖 My AI Assistant</h2>
    <button onclick="clearChat()">New Chat</button>
</header>

<div id="chat">
    <div class="message bot">
        Hello! 👋

        Welcome to My AI Assistant.

        Powered by Groq AI.

        Ask me anything!
    </div>
</div>

<div id="typing"></div>

<div class="input-area">
    <input
        id="input"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
    >

    <button id="send" onclick="sendMessage()">
        Send ➤
    </button>
</div>

</div>

<script>

// GROQ API CONFIGURATION

const API_KEY = "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";

const API_URL =
"https://api.groq.com/openai/v1/chat/completions";

// Available Groq model
const MODEL = "openai/gpt-oss-120b";

// CHAT VARIABLES

let messages = [];

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const typing = document.getElementById("typing");
const send = document.getElementById("send");

// ADD MESSAGE

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

// SEND MESSAGE

async function sendMessage() {

    const text = input.value.trim();

    if (!text || send.disabled) return;

    if (API_KEY === "YOUR_GROQ_API_KEY") {
        addMessage("Please add your Groq API key first.", "bot");
        return;
    }

    addMessage(text, "user");

    input.value = "";

    messages.push({
        role: "user",
        content: text
    });

    typing.textContent = "🤖 AI is thinking...";

    send.disabled = true;

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + API_KEY
            },

            body: JSON.stringify({

                model: MODEL,

                messages: [
                    {
                        role: "system",
                        content:
                        "You are My AI Assistant. Be helpful, friendly and accurate. Explain answers clearly and reply in the user's language."
                    },
                    ...messages.slice(-20)
                ],

                temperature: 0.7,

                max_completion_tokens: 2048

            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "Groq API error"
            );
        }

        const reply =
            data.choices?.[0]?.message?.content;

        if (typeof reply !== "string") {
            throw new Error("Invalid AI response.");
        }

        addMessage(reply, "bot");

        messages.push({
            role: "assistant",
            content: reply
        });

    } catch (error) {

        messages.pop();

        addMessage(
            "⚠️ Error: " + error.message,
            "bot"
        );

        console.error(error);

    } finally {

        typing.textContent = "";

        send.disabled = false;

        input.focus();
    }
}

// NEW CHAT

function clearChat() {

    messages = [];

    chat.innerHTML = "";

    addMessage(
        "Hello! 👋 Welcome back. Ask me anything!",
        "bot"
    );
}

// ENTER KEY

input.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        sendMessage();
    }

});

input.focus();

</script>

</body>
</html>
